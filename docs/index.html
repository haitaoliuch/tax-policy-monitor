<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国家税务总局政策监测</title>
<style>
:root{--blue:#153f72;--bg:#f5f7fb;--line:#e5eaf1;--muted:#69778b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#202936}
header{background:linear-gradient(135deg,#123b6d,#2969a8);color:#fff;padding:30px 22px}
.wrap{max-width:1120px;margin:auto}.brand{font-size:25px;font-weight:800}.sub{font-size:14px;opacity:.86;margin-top:7px}
main{max-width:1120px;margin:22px auto;padding:0 18px 40px}
.toolbar{display:grid;grid-template-columns:1fr 160px;gap:10px;margin-bottom:15px}
input,select{width:100%;padding:11px 12px;border:1px solid #d8e0ea;border-radius:9px;background:#fff;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:17px}
.stat,.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 9px rgba(20,40,70,.045)}
.stat{padding:16px}.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:22px;font-weight:800;margin-top:5px}
.card{padding:19px 21px;margin-bottom:13px}.meta{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
h2{font-size:18px;line-height:1.5;margin:8px 0 11px}.badge{font-size:11px;color:#9a4600;background:#fff0da;padding:3px 7px;border-radius:99px;margin-left:7px}
.summary{white-space:pre-wrap;background:#f8fafc;border-left:3px solid #8bb3dc;padding:12px 14px;border-radius:5px;line-height:1.72;font-size:14px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.links a{color:var(--blue);background:#eaf2fb;text-decoration:none;padding:7px 10px;border-radius:7px;font-size:12px}
.empty{text-align:center;color:var(--muted);padding:42px}.note{text-align:center;color:#8d99a8;font-size:12px;margin:25px 0}
@media(max-width:700px){.toolbar,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">国家税务总局政策监测</div><div class="sub">每日自动检查 · 新政策识别 · 附件归档 · 快速摘要</div></div></header>
<main>
<div class="toolbar">
<input id="q" placeholder="搜索政策名称、文号或摘要…" oninput="render()">
<select id="year" onchange="render()"><option value="">全部年份</option></select>
</div>
<div class="stats">
<div class="stat"><div class="k">已收录政策</div><div class="v" id="total">0</div></div>
<div class="stat"><div class="k">本月发布</div><div class="v" id="month">0</div></div>
<div class="stat"><div class="k">最后自动检查</div><div class="v" id="checked" style="font-size:15px">--</div></div>
</div>
<div id="list"></div>
<div class="note">数据来源：国家税务总局官网 / 政策法规库。摘要仅用于快速浏览，正式执行以政策原文为准。</div>
</main>
<script>
let db={last_checked:"",policies:[]};
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function boot(){
 try{const r=await fetch("./policies.json?t="+Date.now()); db=await r.json()}catch(_){}
 const ys=[...new Set((db.policies||[]).map(x=>(x.publish_date||"").slice(0,4)).filter(Boolean))].sort().reverse();
 document.querySelector("#year").innerHTML='<option value="">全部年份</option>'+ys.map(y=>`<option>${y}</option>`).join("");
 render()
}
function render(){
 const q=document.querySelector("#q").value.trim().toLowerCase(), y=document.querySelector("#year").value;
 const all=(db.policies||[]).slice().sort((a,b)=>(b.publish_date||"").localeCompare(a.publish_date||""));
 const rows=all.filter(p=>(!q||`${p.title} ${p.document_no||""} ${p.summary||""}`.toLowerCase().includes(q))&&(!y||(p.publish_date||"").startsWith(y)));
 document.querySelector("#total").textContent=all.length;
 const d=new Date(), ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
 document.querySelector("#month").textContent=all.filter(p=>(p.publish_date||"").startsWith(ym)).length;
 document.querySelector("#checked").textContent=db.last_checked||"--";
 document.querySelector("#list").innerHTML=rows.length?rows.map((p,i)=>`
 <article class="card"><div class="meta"><span>${e(p.publish_date||"日期待核")}</span>${p.document_no?`<span>${e(p.document_no)}</span>`:""}</div>
 <h2>${e(p.title)}${i<3?'<span class="badge">最新</span>':""}</h2>
 <div class="summary">${e(p.summary||"暂无摘要")}</div>
 <div class="links"><a href="${e(p.url)}" target="_blank" rel="noopener">政策原文</a>
 ${(p.attachments||[]).map(a=>`<a href="${e(a.local_path||a.url)}" target="_blank" rel="noopener">附件：${e(a.name||"下载")}</a>`).join("")}</div></article>`).join("")
 :'<div class="card empty">暂时没有符合条件的政策。</div>'
}
boot();
</script>
</body></html>
